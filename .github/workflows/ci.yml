name: ci

# Every pull request and every push to main. This is the fast lane: it must be
# quick enough that nobody is tempted to skip it, so the browser-heavy checks
# (Lighthouse, contrast, axe, visual diff) live in release-gate.yml instead.
#
# It does run the things a local release gate cannot: the RLS suite and the
# end-to-end suite, both of which need a writable Supabase stack. That is not a
# nicety — those two stages are `skipped` in every local scorecard, and a skip
# is never a pass, so this workflow is what makes an L2 verdict possible at all.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A local stack only. The e2e suite signs up users and drives orders to payout
  # and refund; pointed at the real project it would do all of that for real.
  #
  # E2E_PORT and NEXT_PUBLIC_SITE_URL must name the same port. They did not:
  # the app was built believing it lived on :3000 while Playwright served it on
  # :3100, so every absolute URL the app generated — order links in
  # notifications, payment return URLs — pointed at a port nothing was
  # listening on.
  E2E_PORT: '3100'
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  PAYMENT_PROVIDER: mock
  EMAIL_PROVIDER: mock
  AI_LISTING_ENABLED: 'false'
  ADMIN_EMAIL: admin@restyle.test
  CRON_SECRET: ci-only-not-a-real-secret-0000000000000000000000000000

jobs:
  static:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    # Deliberately no `npm run build` here. Building collects page data, which
    # reads the database, so a build without a Supabase stack fails on
    # /sitemap/[chunk] — not because anything is wrong, but because nothing is
    # there. The build belongs in the job that has a stack.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  database:
    name: RLS · e2e · JSON-LD
    runs-on: ubuntu-latest
    # Playwright, a browser's worth of dependencies and a Supabase stack.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start a local Supabase stack
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase start
        # This also applies everything in supabase/migrations. Running
        # `npm run db:migrate` afterwards double-applies them, and 0021 creates
        # policies without an `if not exists` guard, so the second pass fails on
        # "policy already exists". The fix is to let one thing own the schema,
        # not to make every migration re-runnable.
        run: supabase start

      - name: Export the local stack's credentials
        # `supabase status -o env` prints the keys the stack generated. They are
        # local-only and regenerated per run, so they are not secrets — but they
        # are still masked, because a log that prints key-shaped strings teaches
        # people to ignore key-shaped strings in logs.
        run: |
          supabase status -o env | while IFS='=' read -r key value; do
            value="${value%\"}"; value="${value#\"}"
            case "$key" in
              API_URL)      echo "NEXT_PUBLIC_SUPABASE_URL=$value" >> "$GITHUB_ENV" ;;
              ANON_KEY)     echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$value" >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY)
                            echo "::add-mask::$value"
                            echo "SUPABASE_SERVICE_ROLE_KEY=$value" >> "$GITHUB_ENV" ;;
              DB_URL)       echo "DATABASE_URL=$value" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Confirm the schema is there
        # `supabase start` applying migrations is a behaviour, not a contract.
        # If it ever stops, every check below would run against an empty schema
        # and report something other than "the schema is missing" — so ask now,
        # while the answer is still legible.
        run: |
          count=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "public tables: $count"
          if [ "$count" -lt 20 ]; then
            echo "Expected the migrations to have been applied by 'supabase start'."
            exit 1
          fi

      - name: Seed
        # The RLS suite asserts every policy in both directions, which needs rows
        # in every status to assert against. Without this it reports
        # `rls-fixture-absent` — honest, and useless as a gate.
        run: npm run db:seed

      - name: RLS assertions
        run: npm run db:rlstest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end, four actor roles
        run: npm run test:e2e

      - name: JSON-LD structured data
        run: |
          npx next start --port "$E2E_PORT" &
          npx wait-on "http://127.0.0.1:$E2E_PORT" --timeout 120000
          npm run seo:validate

      - name: Static gate stages
        # Hebrew copy lint and the rest of the gate's non-browser checks. Run
        # here rather than in the `static` job because the build stage needs the
        # stack that only exists in this one.
        run: npm run release-gate -- --fast --no-append

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
